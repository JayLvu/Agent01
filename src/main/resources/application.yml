server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: agent01
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 文件上传配置(用于 RAG 文档导入)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # Redis 配置(对话记忆 + 向量检索)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 数据库: H2(文件模式)持久化审计日志 / Token 成本 / 定时任务
  datasource:
    url: jdbc:h2:file:./data/agent01;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# DeepSeek 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:${DEEK_SEEK_API_KEY:}}
  base-url: ${DEEPSEEK_BASE_URL:${DEEK_SEEK_BASE_URL:https://api.deepseek.com}}
  model: ${DEEPSEEK_MODEL:${DEEK_SEEK_MODEL:deepseek-chat}}
  temperature: ${DEEPSEEK_TEMPERATURE:${DEEK_SEEK_TEMPERATURE:0.7}}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:${DEEK_SEEK_MAX_TOKENS:2048}}
  timeout: 60s

# Agent 配置
agent:
  # 对话记忆: 保留最近 N 轮对话
  memory:
    max-history: 20
    ttl-hours: 24
    # 记忆摘要压缩: 历史消息数超过 threshold 时,把更早的消息压成摘要
    summarize-enabled: true
    summarize-threshold: 16
    summarize-keep-recent: 8

  # 多模型路由: 在 deepseek 默认模型之外,可配置多个模型并按需路由
  router:
    enabled: true
    default-model: ""          # 留空则用 deepseek.model
    reasoning-model: ""        # 需要深度推理时切换的模型(留空则用 default)
    reasoning-keywords: "分析,推理,为什么,对比,总结,设计,方案,debug,优化,实现"

  # Token 成本统计(每百万 token 价格,单位元)
  cost:
    enabled: true
    currency: "CNY"
    prompt-price: 2.0          # 输入每 1M token 价格
    completion-price: 8.0      # 输出每 1M token 价格

  # 工具调用配置
  tools:
    enabled: true
    max-iterations: 8
    parallel: true             # 并行执行无依赖的工具调用
    shell:
      enabled: true
      timeout-ms: 10000
      working-dir: ""
    # 联网搜索工具
    search:
      enabled: true
      provider: "bing"         # bing(默认,无需key) | duckduckgo | serper
      api-key: ""              # serper 需要 SERPER_API_KEY
      max-results: 5
    # 浏览器自动化工具(轻量网页抓取)
    browser:
      enabled: true
      timeout-ms: 10000
      max-chars: 6000
    # 定时任务工具
    scheduler:
      enabled: true
      tick-ms: 60000

  # RAG 文档检索
  rag:
    enabled: true
    upload-dir: ${DOCS_UPLOAD_DIR:./data/docs}
    chunk-size: ${DOCS_CHUNK_SIZE:500}
    chunk-overlap: ${DOCS_CHUNK_OVERLAP:100}
    top-k: 4
    # 简单向量实现: 使用 TF-IDF 或字符 n-gram(无需额外模型)
    vector-dim: 256

# 日志配置
logging:
  level:
    root: INFO
    com.vanzy.agent: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/agent.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
