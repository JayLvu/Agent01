server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: agent01
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 文件上传配置(用于 RAG 文档导入)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # Redis 配置(对话记忆 + 向量检索)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# DeepSeek 配置
deepseek:
  api-key: ${DEEK_SEEK_API_KEY:}
  base-url: ${DEEK_SEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEK_SEEK_MODEL:deepseek-chat}
  temperature: ${DEEK_SEEK_TEMPERATURE:0.7}
  max-tokens: ${DEEK_SEEK_MAX_TOKENS:2048}
  timeout: 60s

# Agent 配置
agent:
  # 对话记忆: 保留最近 N 轮对话
  memory:
    max-history: 20
    ttl-hours: 24
  # RAG 文档检索
  rag:
    enabled: true
    upload-dir: ${DOCS_UPLOAD_DIR:./data/docs}
    chunk-size: ${DOCS_CHUNK_SIZE:500}
    chunk-overlap: ${DOCS_CHUNK_OVERLAP:100}
    top-k: 4
    # 简单向量实现: 使用 TF-IDF 或字符 n-gram(无需额外模型)
    vector-dim: 256

# 日志配置
logging:
  level:
    root: INFO
    com.vanzy.agent: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/agent.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
